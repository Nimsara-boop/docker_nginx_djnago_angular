version: '2'
services:

  nginx:
    ports:
        - "80:80"
    build: ./nginx
    container_name: cont_nginx
    restart: unless-stopped
    links:
        - django_server:web
    volumes_from:
        - angular2
        # * Volumes_from layer is used to mount the angular2 container's volume into the nginx container. 
        # * This allows nginx to serve the static files generated by the Angular2 application.
        # * This is shared volume between the two containers, 
        #   so any changes made to the files in the angular2 container will be reflected in the nginx container as well.
  
  
  
  angular2:
    build: ./angular2
    container_name: cont_angular2
    restart: unless-stopped
    entrypoint: "true" # entrypoint: "true" is not  a real entrypoint, and is a trick make the container do nothing and exit immediately.
    volumes:
        - /usr/share/nginx/angular2
# the only purpose of this container is to buid and generate the static files for the frontend, 
# and make them available to nginx container via the shared volumes (/usr/share/nginx/angular2). 



  django_server:
    build: ./django_server
    container_name: cont_django_server
    restart: unless-stopped
    expose: 
        - "8000"
    links:
        - redis:redis







  redis:
    image: redis
    #command: "./docker-entrypoint.sh"