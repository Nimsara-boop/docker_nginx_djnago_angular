services:
  db:
    image: postgres:17
    container_name: pgdata_cont
    ports:
      - "5432:5432"
    env_file:
      - .env.prod
    volumes:
      - database:/var/lib/postgresql/data
    
  backend:
    build: backend
    container_name: back_cont
    depends_on:
      - db
    volumes:
      - ./static:/app/static
    env_file:
      - .env.prod

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no   # pure cache, no persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10 


  frontend:
    build:
      context: .    
      dockerfile: frontend/Dockerfile
    container_name: front_cont
    volumes:
        - ./frontend:/app
        - ./frontend/dist:/app/dist
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
        - 4200:80
    depends_on:
        - backend

volumes:
  database:
