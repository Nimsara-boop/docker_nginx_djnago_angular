services:
  db:
    image: postgres:17
    container_name: pgdata_cont
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - database:/var/lib/postgresql/data
      
  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: nimsarakarunaratne@gmail.com
      PGADMIN_DEFAULT_PASSWORD: Conduit@2026
    ports:
      - "127.0.0.1:5050:80"
    
  backend:
    build: backend
    environment:
      DJANGO_ENV: staging
    container_name: back_cont
    depends_on:
      db:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./static:/app/static
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no   # pure cache, no persistence
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10 

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch_cont
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: front_cont
    volumes:
        - ./frontend:/app
        - ./frontend/dist:/app/dist
        - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
        - "4200:80"
    depends_on:
        - backend
                
  nginx:
    image: nginx:alpine  
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./backend-drf/static:/static
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend

volumes:
  database:
  elasticsearch:
