name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    - name: Run Tests
      env: 
        DJANGO_ENV: "development"
        DJANGO_SECRET_KEY: "django-insecure-g&lp-p4!xc53=r_$1kup%#-bmpo4h+1$gw9@!2jp5a3y%t@sg9"
        DJANGO_ALLOWED_HOSTS: localhost,frontend,backend,nginx,162.35.34.77,www.nimsaravps.site,nimsaravps.site
        DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:4200, http://www.nimsaravps.site,http://nimsaravps.site
        DATABASE_ENGINE: postgresql_psycopg2
        DATABASE_NAME: realworld
        DATABASE_USER: postgres
        DATABASE_PASSWORD: Tinkytinky@3436
        DATABASE_HOST: db
        DATABASE_PORT: 5432
      run: |
        python backend/manage.py test
